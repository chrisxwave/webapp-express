```html
<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dettaglio film</title>

    <link rel="stylesheet" href="movies.css">
</head>

<body>

    <a href="/">← Torna ai film</a>

    <!-- 1. Titolo del film -->
    <h1 id="title"></h1>

    <!-- 2. Contenitore dei dettagli del film -->
    <div id="movie"></div>

    <h2>Recensioni</h2>

    <!-- 3. Contenitore di tutte le recensioni -->
    <div id="reviews"></div>

    <h2>Aggiungi una recensione</h2>

    <!-- 4. Form per inserire una nuova recensione -->
    <form id="reviewForm">

        <input
            type="text"
            id="name"
            placeholder="Il tuo nome"
            required
        >

        <input
            type="number"
            id="vote"
            min="1"
            max="5"
            placeholder="Voto 1-5"
            required
        >

        <textarea
            id="text"
            placeholder="Scrivi la tua recensione"
            required
        ></textarea>

        <button type="submit">
            Invia recensione
        </button>

    </form>

    <script>

        // 5. Recupero l'id del film dall'URL
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");


        // GET: recupero il film e le sue recensioni dal server
        fetch(`/movies/${id}`)

            // Converto la risposta del server in JSON
            .then(response => response.json())

            .then(data => {

                // Separo i dati del film dalle recensioni
                const movie = data.movie;
                const reviews = data.reviews;


                // Inserisco il titolo nella pagina
                document.getElementById("title").textContent =
                    movie.title;


                // 6. Mostro i dettagli del film usando i dati ricevuti
                document.getElementById("movie").innerHTML = `

                    <img
                        src="/images/${movie.image}"
                        width="280"
                    >

                    <h2>${movie.title}</h2>

                    <p>
                        Regista: ${movie.director}
                    </p>

                    <p>
                        Genere: ${movie.genre}
                    </p>

                    <p>
                        Anno: ${movie.release_year}
                    </p>

                    <p>
                        ${movie.abstract}
                    </p>

                `;


                // Prendo il contenitore delle recensioni
                const reviewsContainer =
                    document.getElementById("reviews");


                // 7. forEach legge ogni recensione una alla volta
                reviews.forEach(review => {

                    // Aggiungo la recensione alla pagina
                    reviewsContainer.innerHTML += `

                        <div class="review">

                            <h3>
                                ${review.name}
                            </h3>

                            <p>
                                Voto: ${review.vote}/5
                            </p>

                            <p>
                                ${review.text}
                            </p>

                            <!-- Passo l'id alla funzione per modificare o eliminare -->
                            <button
                                onclick="editReview(${review.id})"
                            >
                                Modifica
                            </button>

                            <button
                                onclick="deleteReview(${review.id})"
                            >
                                Elimina
                            </button>

                        </div>

                    `;

                });

            });


        // POST: aggiungo una nuova recensione
        document
            .getElementById("reviewForm")
            .addEventListener("submit", function(event) {

                // Impedisco al form di ricaricare automaticamente la pagina
                event.preventDefault();


                // Recupero i valori inseriti nei campi
                const name =
                    document.getElementById("name").value;

                const vote =
                    document.getElementById("vote").value;

                const text =
                    document.getElementById("text").value;


                // 8. Invio i dati della nuova recensione al server
                fetch("/reviews", {

                    method: "POST",

                    // Indico che sto inviando dati in formato JSON
                    headers: {
                        "Content-Type": "application/json"
                    },

                    // Trasformo i dati in una stringa JSON
                    body: JSON.stringify({

                        movie_id: id,
                        name: name,
                        vote: vote,
                        text: text

                    })

                })

                .then(response => {

                    // Controllo se il server ha risposto correttamente
                    if (!response.ok) {
                        throw new Error("Errore nell'aggiunta");
                    }

                    return response.json();

                })

                .then(data => {

                    console.log(data);

                    alert("Recensione aggiunta!");

                    // Ricarico la pagina per vedere la nuova recensione
                    location.reload();

                })

                .catch(error => {

                    // Mostro eventuali errori nella console
                    console.error(error);

                    alert("Errore nell'aggiunta della recensione.");

                });

            });


        // PUT: modifico una recensione esistente
        function editReview(reviewId) {

            // Chiedo all'utente i nuovi dati
            const name = prompt("Nuovo nome:");

            if (name === null) {
                return;
            }

            const vote = prompt("Nuovo voto da 1 a 5:");

            if (vote === null) {
                return;
            }

            const text = prompt("Nuova recensione:");

            if (text === null) {
                return;
            }


            // 9. Controllo che i dati inseriti siano validi
            if (
                !name.trim() ||
                !text.trim() ||
                !Number.isInteger(Number(vote)) ||
                Number(vote) < 1 ||
                Number(vote) > 5
            ) {

                alert(
                    "Inserisci un nome, un voto da 1 a 5 e una recensione."
                );

                return;
            }


            // Invio al server i nuovi dati della recensione
            fetch(`/reviews/${reviewId}`, {

                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    name: name,
                    vote: Number(vote),
                    text: text

                })

            })

            .then(response => {

                if (!response.ok) {
                    throw new Error("Errore nella modifica");
                }

                return response.json();

            })

            .then(data => {

                console.log(data);

                alert("Recensione modificata!");

                // Aggiorno la pagina per mostrare le modifiche
                location.reload();

            })

            .catch(error => {

                console.error(error);

                alert("Errore nella modifica della recensione.");

            });

        }


        // DELETE: elimino una recensione
        function deleteReview(reviewId) {

            // Chiedo conferma prima di eliminare
            const conferma = confirm(
                "Vuoi davvero eliminare questa recensione?"
            );

            // Se l'utente annulla, interrompo la funzione
            if (!conferma) {
                return;
            }


            // 10. Invio la richiesta DELETE per eliminare la recensione
            fetch(`/reviews/${reviewId}`, {

                method: "DELETE"

            })

            .then(response => {

                if (!response.ok) {
                    throw new Error("Errore nell'eliminazione");
                }

                return response.json();

            })

            .then(data => {

                console.log(data);

                alert("Recensione eliminata!");

                // Ricarico la pagina senza la recensione eliminata
                location.reload();

            })

            .catch(error => {

                console.error(error);

                alert("Errore nell'eliminazione della recensione.");

            });

        }

    </script>

</body>

</html>
